<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediPulse - Medical Records</title>
    <link rel="stylesheet" href="css/doctor.css?v=20261007-final">
    <link rel="stylesheet" href="../assets/medipulse-ui.css">
    <link rel="icon" type="image/png" href="../assets/medipulse-logo.png">
<link rel="stylesheet" href="../assets/portal-theme.css?v=20261007-final">
</head>
<body data-page="records">
    <div id="appShell"></div>
    <main class="page-content">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Doctor / Medical</p>
                <h1>Medical Records</h1>
                <p class="muted">View records for an authorized patient or create a new consultation record.</p>
            </div>
            <button class="secondary-button" id="refreshPage">Refresh</button>
        </div>
        <div id="pageMessage" class="page-message"></div>

<section class="panel">
    <div class="form-row">
        <div class="field">
            <label for="recordPatient">Authorized Patient</label>
            <select id="recordPatient" class="select-input"></select>
        </div>
        <button class="secondary-button align-end" id="loadRecords">Load Records</button>
    </div>
</section>

<section class="content-grid two-columns">
    <article class="panel">
        <div class="panel-header"><div><h2>Create Medical Record</h2><p class="muted">Only the assigned doctor can create a record.</p></div></div>
        <form id="recordForm" class="form-grid">
            <div class="field full"><label for="recordDiagnosis">Diagnosis / Consultation Finding</label><input id="recordDiagnosis" required></div>
            <div class="field full"><label for="recordTreatment">Treatment / Advice</label><textarea id="recordTreatment" rows="4"></textarea></div>
            <div class="field"><label for="recordDate">Record Date & Time</label><input id="recordDate" type="datetime-local" required></div>
            <button class="primary-button" type="submit">Create Record</button>
        </form>
    </article>

    <article class="panel">
        <div class="panel-header"><div><h2>Record History</h2><p class="muted">Records for the selected authorized patient.</p></div></div>
        <div id="recordsList" class="stack-list"><div class="empty-state">Select a patient.</div></div>
    </article>
</section>
    </main>
    <script src="../shared/config.js?v=20261007-final"></script><script src="../shared/auth.js?v=20261007-final"></script><script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/doctor.js"></script><script src="js/portal.js"></script>
<script src="../assets/toast.js"></script>
</body>
</html>
