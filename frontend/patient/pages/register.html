<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediPulse | Patient Registration</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../../assets/medipulse-ui.css">
    <link
        rel="icon"
        type="image/png"
        href="../../assets/medipulse-logo.png"
    >
    <link rel="stylesheet" href="../../assets/auth-theme.css?v=20261009-final">
</head>

<body class="auth-unified">


    <a href="../../index.html" class="hub-back-button">
        ← Back to MediPulse Hub
    </a>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">

                <img
                    class="mp-logo"
                    src="../../assets/medipulse-logo.png"
                    alt="MediPulse logo"
                >

                <div>
                    <h1>MediPulse</h1>
                    <p>Healthcare Management System</p>
                </div>

            </div>

            <div class="auth-heading">

                <h2>Create your account</h2>

                <p>
                    Register to access your patient portal.
                </p>

            </div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small
                        class="field-error"
                        id="emailError"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="phone">
                        Phone number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        autocomplete="tel"
                        placeholder="Enter your phone number"
                        inputmode="numeric"
                        maxlength="10"
                    >

                    <small
                        class="field-error"
                        id="phoneError"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <small class="password-rule">
                        Use at least 8 characters and include at least one special character.
                    </small>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                            title="Show password"
                        >
                            <span aria-hidden="true">◉</span>
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="passwordError"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            autocomplete="new-password"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                            aria-label="Show password"
                            title="Show password"
                        >
                            <span aria-hidden="true">◉</span>
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="confirmPasswordError"
                    ></small>

                </div>


                <div class="form-group">

                    <label for="securityQuestion">
                        Security question
                    </label>

                    <select
                        id="securityQuestion"
                        name="securityQuestion"
                        required
                    >
                        <option value="">
                            Choose a security question
                        </option>
                        <option value="What is your first pet's name?">
                            What is your first pet's name?
                        </option>
                        <option value="What city were you born in?">
                            What city were you born in?
                        </option>
                        <option value="What is your mother's maiden name?">
                            What is your mother's maiden name?
                        </option>
                        <option value="What was the name of your first school?">
                            What was the name of your first school?
                        </option>
                        <option value="What is your favourite food?">
                            What is your favourite food?
                        </option>
                    </select>

                    <small
                        class="field-error"
                        id="securityQuestionError"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="securityAnswer">
                        Security answer
                    </label>

                    <input
                        type="text"
                        id="securityAnswer"
                        name="securityAnswer"
                        autocomplete="off"
                        placeholder="Enter the answer"
                        required
                    >

                    <small
                        class="field-error"
                        id="securityAnswerError"
                    ></small>

                </div>

                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >
                    Create account
                </button>

                <p
                    id="registerMessage"
                    class="form-message"
                    aria-live="polite"
                ></p>

            </form>

            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign in
                </a>

            </div>

            <p class="mp-role-switch">
                Doctor or staff?
                <a href="../../doctor/index.html">
                    Go to the Doctor Portal
                </a>
            </p>

        </section>

    </main>

    <script src="../../shared/config.js?v=20261007-final"></script>
    <script src="../../shared/auth.js?v=20261007-final"></script>
    <script src="../js/app.js?v=20261009-final"></script>

</body>

</html>
